[workspace]
resolver = "3"
members = ["crates/tayoreader-core", "crates/tayoreader-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
feed-rs = "2.4.0"
futures = "0.3.34"
hex = "0.4.3"
opml = "1.1.6"
predicates = "3.1.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
sha2 = "0.11.0"
tayoreader-core = { path = "crates/tayoreader-core" }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
